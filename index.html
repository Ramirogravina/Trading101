<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading101 (sin instalación)</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1000px;margin:20px auto;padding:0 16px;background:#0f172a;color:#e2e8f0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .card{background:#111827;border:1px solid #334155;border-radius:10px;padding:12px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border-bottom:1px solid #334155;text-align:left}
    .pos{color:#22c55e}.neg{color:#ef4444}
  </style>
</head>
<body>
  <h1>Trading101 - Modo Standalone</h1>
  <p>Esta versión reemplaza React/Vite y funciona sin npm, sin instalación y sin localStorage. Si hay red, toma precios públicos; si no, usa respaldo.</p>
  <div id="stats" class="grid"></div>
  <table>
    <thead><tr><th>Ticker</th><th>Tipo</th><th>Invertido</th><th>Precio actual</th><th>Valor actual</th><th>Retorno</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
<script>
const txs=[
 {ticker:'SPY',type:'ETF',investedAmount:1000,purchasePrice:500},
 {ticker:'AAPL',type:'Acción USA',investedAmount:1200,purchasePrice:190},
 {ticker:'AL30',type:'Bono',investedAmount:800,purchasePrice:49},
 {ticker:'KO',type:'CEDEAR',investedAmount:600,purchasePrice:58}
];
const fallback={SPY:531.2,AAPL:202.4,AL30:51.7,KO:62.1};
async function getPrices(){
  try{
    const symbols=Object.keys(fallback).join(',');
    const r=await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols}`);
    if(!r.ok) throw new Error('http');
    const d=await r.json();
    const map={...fallback};
    for(const q of d?.quoteResponse?.result||[]) if(Number.isFinite(q.regularMarketPrice)) map[q.symbol]=q.regularMarketPrice;
    return map;
  }catch{return fallback;}
}
function calc(prices){
  return txs.map(t=>{const sh=t.purchasePrice>0?t.investedAmount/t.purchasePrice:0;const cv=sh*(prices[t.ticker]??t.purchasePrice);const pnl=cv-t.investedAmount;const ret=t.investedAmount?100*pnl/t.investedAmount:0;return {...t,currentPrice:prices[t.ticker]??0,currentValue:cv,ret};});
}
function render(h){
  const inv=h.reduce((s,x)=>s+x.investedAmount,0), val=h.reduce((s,x)=>s+x.currentValue,0), pnl=val-inv, ret=inv?100*pnl/inv:0;
  document.getElementById('stats').innerHTML=`<div class='card'><b>Total invertido</b><div>$${inv.toFixed(2)}</div></div><div class='card'><b>Valor actual</b><div>$${val.toFixed(2)}</div></div><div class='card'><b>P/L</b><div class='${pnl>=0?'pos':'neg'}'>$${pnl.toFixed(2)}</div></div><div class='card'><b>Retorno</b><div class='${ret>=0?'pos':'neg'}'>${ret.toFixed(2)}%</div></div>`;
  document.getElementById('rows').innerHTML=h.map(x=>`<tr><td>${x.ticker}</td><td>${x.type}</td><td>$${x.investedAmount.toFixed(2)}</td><td>$${x.currentPrice.toFixed(2)}</td><td>$${x.currentValue.toFixed(2)}</td><td class='${x.ret>=0?'pos':'neg'}'>${x.ret.toFixed(2)}%</td></tr>`).join('');
}
getPrices().then((prices)=>render(calc(prices)));
</script>
</body>
</html>
